<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PO Table</title>
<link rel="stylesheet" href="po-table.css" />
</head>
<body>

<header class="app-header">
  <div class="app-title">Purchase Orders</div>
  <div class="header-right">
    <button type="button" class="btn" id="editTableBtn">Edit table</button>
    <button type="button" class="btn btn-primary" onclick="loadData()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      Refresh
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="searchInput" placeholder="Search PO #, vendor, style…" oninput="applyFilters()" />
  </div>


  <div class="filter-btn-group" id="divisionFilters" role="group" aria-label="Division"></div>

  <div class="toolbar-status-row">
    <div class="filter-btn-group status-filters" id="statusFilters" role="group" aria-label="Status"></div>
    <div class="toolbar-end">
      <button type="button" class="clear-all-filters-btn" id="clearAllColumnFiltersBtn" hidden>Clear all filters</button>
      <label class="page-size-control">
        <span class="page-size-label">Rows</span>
        <select id="pageSizeSelect" class="filter-select page-size-select" aria-label="Rows per page">
          <option value="30">30</option>
          <option value="60">60</option>
          <option value="120">120</option>
          <option value="all" selected>All</option>
        </select>
      </label>
      <nav class="pagination" id="paginationNav" hidden aria-label="Table pages">
        <button type="button" class="btn btn-page" id="pageFirst" title="First page" aria-label="First page">«</button>
        <button type="button" class="btn btn-page" id="pagePrev" title="Previous page" aria-label="Previous page">‹</button>
        <span class="page-indicator" id="pageIndicator">1 / 1</span>
        <button type="button" class="btn btn-page" id="pageNext" title="Next page" aria-label="Next page">›</button>
        <button type="button" class="btn btn-page" id="pageLast" title="Last page" aria-label="Last page">»</button>
      </nav>
      <div class="counter" id="rowCounter">— rows</div>
    </div>
  </div>
</div>

<div class="table-scroll-y">
  <div class="table-scroll-x">
  <table id="poTable">
    <colgroup>
      <col class="col-division" /><col class="col-status" /><col class="col-vendor" />
      <col class="col-buyer" /><col class="col-buyer-po" />
      <col class="col-so" /><col class="col-po-date" /><col class="col-po" />
      <col class="col-old-po" /><col class="col-style" /><col class="col-color" />
      <col class="col-po-qty" /><col class="col-actual-qty" /><col class="col-ctn-qty" />
      <col class="col-ship-method" /><col class="col-eta" />
      <col class="col-ihd" /><col class="col-est-exf" /><col class="col-est-ihd" /><col class="col-exf" />
      <col class="col-cxl" /><col class="col-assign" /><col class="col-notes" />
    </colgroup>
    <thead>
      <tr>
        <th data-col="Division" onclick="sortBy('Division')">Division</th>
        <th data-col="Status" onclick="sortBy('Status')">Status</th>
        <th class="th-filterable" data-col="Vendor"><span class="th-label">Vendor</span></th>
        <th class="th-filterable" data-col="Buyer"><span class="th-label">Buyer</span></th>
        <th data-col="Buyer PO #" onclick="sortBy('Buyer PO #')">Buyer PO #</th>
        <th data-col="SO #" onclick="sortBy('SO #')">SO #</th>
        <th data-col="PO Date" onclick="sortBy('PO Date')">PO Date</th>
        <th data-col="PO #" onclick="sortBy('PO #')">PO #</th>
        <th data-col="Old PO #" onclick="sortBy('Old PO #')">Old PO #</th>
        <th data-col="Style #" onclick="sortBy('Style #')">Style #</th>
        <th data-col="Color" onclick="sortBy('Color')">Color</th>
        <th data-col="PO Qty" onclick="sortBy('PO Qty')">PO Qty</th>
        <th data-col="Actual Qty" onclick="sortBy('Actual Qty')">Actual Qty</th>
        <th data-col="Ctn Qty" onclick="sortBy('Ctn Qty')">Ctn Qty</th>
        <th class="th-filterable" data-col="Ship Method"><span class="th-label">Ship Method</span></th>
        <th data-col="ETA" onclick="sortBy('ETA')">ETA</th>
        <th data-col="IHD" onclick="sortBy('IHD')">IHD</th>
        <th data-col="EST EXF" onclick="sortBy('EST EXF')">EST EXF</th>
        <th data-col="EST IHD" onclick="sortBy('EST IHD')">EST IHD</th>
        <th data-col="EXF" onclick="sortBy('EXF')">EXF</th>
        <th data-col="CXL Date" onclick="sortBy('CXL Date')">CXL Date</th>
        <th data-col="Assign Date" onclick="sortBy('Assign Date')">Assign Date</th>
        <th data-col="Notes" onclick="sortBy('Notes')">Notes</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr class="state-row"><td colspan="23">Loading POs…</td></tr>
    </tbody>
  </table>
  </div>
</div>

<div id="editTablePopover" class="column-filter-popover edit-table-popover" hidden>
  <div class="column-filter-toolbar">
    <span class="edit-table-title">Show columns</span>
    <span class="column-filter-sep">|</span>
    <button type="button" class="column-filter-link" id="editTableSelectAll">Select all</button>
    <span class="column-filter-sep">|</span>
    <button type="button" class="column-filter-link" id="editTableClearAll">Clear all</button>
  </div>
  <div class="edit-table-list" id="editTableColumnList"></div>
  <div class="column-filter-footer">
    <button type="button" class="btn btn-primary column-filter-ok" id="editTableOk">OK</button>
    <button type="button" class="btn column-filter-cancel" id="editTableCancel">Cancel</button>
  </div>
</div>

<div id="columnFilterPopover" class="column-filter-popover" hidden>
  <div class="column-filter-toolbar">
    <button type="button" class="column-filter-link" id="columnFilterSelectAll">Select all</button>
    <span class="column-filter-sep">|</span>
    <button type="button" class="column-filter-link" id="columnFilterClearAll">Clear all</button>
  </div>
  <div class="column-filter-list" id="columnFilterList"></div>
  <div class="column-filter-footer">
    <button type="button" class="btn btn-primary column-filter-ok" id="columnFilterOk">OK</button>
    <button type="button" class="btn column-filter-cancel" id="columnFilterCancel">Cancel</button>
  </div>
</div>

<div id="cellSelectDropdown" class="cell-select-dropdown" hidden></div>

<div class="save-indicator" id="saveIndicator"></div>

<div id="modalOverlay" class="modal-backdrop" onclick="closeModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-header-main">
        <h3>PO # <span id="modalPoNum" class="modal-po-num">—</span></h3>
        <span id="modalStatusBadge" class="modal-status-badge"></span>
      </div>
      <button type="button" class="btn-close" onclick="closeModalForce()" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="po-table.js"></script>
</body>
</html>
