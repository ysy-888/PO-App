services:
  - type: web
    name: po-app-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: KEEP_ALIVE_URL
        value: https://po-app-api.onrender.com
      - key: ALLOWED_ORIGIN
        value: https://ysy-888.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501
      - key: APPS_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbwj21tDgZBM19ALLOPpHMlMCnf9-VY4prU6l0m3K3E5O7S5PxTtXJFGxtQHFLGAEb0/exec
      - key: APPS_SCRIPT_EMAIL_TOKEN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
