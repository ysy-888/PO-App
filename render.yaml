services:
  - type: web
    name: po-app-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://ysy-888.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501
      - key: APPS_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbxRySh1gggq5hOtA5rHx77tbTwQuYl9FX2rr2xCfHi2EXf3Vp2SLrIaPrVhO9AgISxRpA/exec
