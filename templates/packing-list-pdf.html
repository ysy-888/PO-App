<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Packing List</title>
<style type="text/css">
  * {
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @page {
    size: letter portrait;
    margin: 0;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 816px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 9px;
    line-height: 1.3;
    color: #1a1a18;
    background: #ffffff;
  }
  .pdf-page {
    width: 816px;
    min-height: 1056px;
    margin: 0;
    padding: 0;
    page-break-after: always;
    background: #ffffff;
  }
  .pdf-page:last-child,
  .pdf-page-last {
    page-break-after: auto;
  }
  .pdf-page-inner {
    width: 100%;
    min-height: 1056px;
    display: table;
    border-collapse: collapse;
  }
  .pdf-page-body {
    display: table-row;
  }
  .pdf-page-body > td {
    vertical-align: top;
    padding: 0 14px 14px;
  }
  .pdf-header {
    width: 100%;
    background-color: #2d2d29;
    color: #ffffff;
  }
  .pdf-header td {
    padding: 10px 14px;
    vertical-align: middle;
    background-color: #2d2d29;
  }
  .pdf-header-brand {
    margin: 0 0 3px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #ffffff;
  }
  .pdf-header-title {
    margin: 0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #d4d9df;
  }
  .pdf-header-po {
    font-size: 10px;
    font-weight: 500;
    color: #ffffff;
    text-align: right;
  }
  .pdf-header-sub {
    margin-top: 2px;
    font-size: 9px;
    font-weight: 500;
    color: #d4d9df;
    text-align: right;
  }
  .pdf-section-title {
    margin: 8px 0 3px;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #374151;
  }
  .pdf-summary {
    width: auto;
    max-width: 100%;
    border-collapse: collapse;
    border: 1px solid #e5e7eb;
    table-layout: fixed;
    font-size: 9px;
  }
  .pdf-summary td {
    padding: 2px 5px;
    border-bottom: 1px solid #e5e7eb;
    vertical-align: middle;
  }
  .pdf-summary tr:last-child td {
    border-bottom: none;
  }
  .pdf-summary-label {
    width: 58px;
    max-width: 58px;
    font-size: 8px;
    font-weight: 600;
    color: #374151;
    background-color: #f7f7f8;
    white-space: nowrap;
  }
  .pdf-summary-value {
    width: 68px;
    max-width: 68px;
    font-size: 9px;
    color: #1a1a18;
    background-color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pdf-carton-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #e5e7eb;
    table-layout: fixed;
    font-size: 9px;
    margin-top: 2px;
  }
  .pdf-carton-table th {
    padding: 3px 4px;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #374151;
    background-color: #f7f7f8;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pdf-carton-table td {
    padding: 3px 4px;
    border-bottom: 1px solid #e5e7eb;
    color: #1a1a18;
    font-size: 9px;
    vertical-align: middle;
  }
  .pdf-carton-table tbody tr:last-child td {
    border-bottom: none;
  }
  .pdf-carton-table tfoot td {
    padding: 3px 4px;
    font-size: 9px;
    font-weight: 600;
    color: #1a1a18;
    background-color: #eef0f3;
    border-top: 1px solid #e5e7eb;
    border-bottom: none;
    vertical-align: middle;
  }
  .pdf-num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .pdf-center {
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: #6b7280;
  }
  .pdf-notes {
    margin-top: 6px;
    padding: 6px 8px;
    border: 1px solid #e5e7eb;
    border-radius: 3px;
    font-size: 9px;
  }
  .pdf-notes-title {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #374151;
    margin-bottom: 3px;
  }
  .pdf-empty {
    font-size: 9px;
    color: #6b7280;
    font-style: italic;
    margin: 0;
  }
</style>
</head>

</body>
</html>
