<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Packing List</title>
<style type="text/css">
  * {
    box-sizing: border-box;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @page {
    size: letter portrait;
    margin: 0;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 816px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 9px;
    line-height: 1.3;
    color: #1a1a18;
    background: #ffffff;
  }
  .pdf-page {
    width: 816px;
    min-height: 1056px;
    margin: 0;
    padding: 48px;
    page-break-after: always;
    background: #ffffff;
  }
  .pdf-page:last-child,
  .pdf-page-last {
    page-break-after: auto;
  }
  .pdf-page-content {
    padding-top: 18px;
  }
  .pdf-header {
    width: 100%;
    background-color: #ffffff;
    color: #1a1a18;
    border-bottom: 1px solid #e5e7eb;
  }
  .pdf-header td {
    padding: 10px 0;
    vertical-align: middle;
    background-color: #ffffff;
  }
  .pdf-header-brand {
    margin: 0 0 3px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #1a1a18;
  }
  .pdf-header-title {
    margin: 0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #374151;
  }
  .pdf-header-po {
    font-size: 10px;
    font-weight: 500;
    color: #1a1a18;
    text-align: right;
  }
  .pdf-header-sub {
    margin-top: 2px;
    font-size: 9px;
    font-weight: 500;
    color: #6b7280;
    text-align: right;
  }
  .pdf-page p {
    margin: 0;
  }
  .pdf-section-title {
    margin: 0 0 6px;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #374151;
  }
  .pdf-section-title + .pdf-summary-grid,
  .pdf-section-title + .pdf-carton-table,
  .pdf-section-title + .pdf-carton-table-wrap {
    margin-top: 10px;
  }
  .pdf-section-block {
    margin-bottom: 20px;
  }
  .pdf-section-block:last-child {
    margin-bottom: 0;
  }
  .pdf-details-block {
    margin-bottom: 20px;
  }
  .pdf-packing-block {
    margin-top: 4px;
  }
  .pdf-summary-grid {
    width: 100%;
    border-collapse: separate;
    border-spacing: 12px 0;
    table-layout: fixed;
  }
  .pdf-summary-grid-cell {
    width: 33.33%;
    vertical-align: top;
  }
  .pdf-summary-grid--2col .pdf-summary-grid-cell {
    width: 50%;
  }
  .pdf-summary-col {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #e5e7eb;
    table-layout: fixed;
    font-size: 9px;
  }
  .pdf-summary-col td {
    padding: 4px 8px;
    border-bottom: 1px solid #e5e7eb;
    vertical-align: middle;
  }
  .pdf-summary-col tr:last-child td {
    border-bottom: none;
  }
  .pdf-summary-label {
    width: 58px;
    max-width: 58px;
    font-size: 8px;
    font-weight: 600;
    color: #374151;
    background-color: #f7f7f8;
    white-space: nowrap;
  }
  .pdf-summary-value {
    font-size: 9px;
    color: #1a1a18;
    background-color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pdf-carton-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #e5e7eb;
    table-layout: fixed;
    font-size: 9px;
  }
  .pdf-carton-table th {
    padding: 6px 8px;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #374151;
    background-color: #f7f7f8;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pdf-carton-table td {
    padding: 6px 8px;
    border-bottom: 1px solid #e5e7eb;
    color: #1a1a18;
    font-size: 9px;
    vertical-align: middle;
  }
  .pdf-carton-table th.pdf-ctn-col,
  .pdf-carton-table td.pdf-ctn-col {
    padding-right: 14px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .pdf-carton-table tbody td.pdf-ctn-col {
    font-weight: 700;
  }
  .pdf-carton-table th.pdf-size-col,
  .pdf-carton-table td.pdf-size-col {
    padding: 6px 8px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .pdf-carton-table th.pdf-size-first,
  .pdf-carton-table td.pdf-size-first {
    padding-left: 12px;
  }
  .pdf-carton-table th.pdf-total-col,
  .pdf-carton-table td.pdf-total-col {
    text-align: center;
    font-variant-numeric: tabular-nums;
    border-left: 1px solid #e5e7eb;
    padding-left: 10px;
    padding-right: 10px;
  }
  .pdf-carton-table th.pdf-wt-col,
  .pdf-carton-table td.pdf-wt-col {
    padding: 6px 12px 6px 12px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    border-left: 1px solid #e5e7eb;
    white-space: nowrap;
  }
  .pdf-carton-table-wrap {
    text-align: center;
  }
  .pdf-carton-table--compact {
    width: auto;
    display: inline-table;
    margin: 0 auto;
  }
  .pdf-carton-table--compact th,
  .pdf-carton-table--compact td {
    padding: 6px 5px;
  }
  .pdf-carton-table--compact th.pdf-ctn-col,
  .pdf-carton-table--compact td.pdf-ctn-col {
    padding-right: 12px;
  }
  .pdf-carton-table--compact th.pdf-size-first,
  .pdf-carton-table--compact td.pdf-size-first {
    padding-left: 10px;
  }
  .pdf-carton-table--compact th.pdf-total-col,
  .pdf-carton-table--compact td.pdf-total-col {
    padding-left: 8px;
    padding-right: 8px;
  }
  .pdf-carton-table--compact th.pdf-wt-col,
  .pdf-carton-table--compact td.pdf-wt-col {
    padding: 6px 10px 6px 10px;
  }
  .pdf-title-table th,
  .pdf-title-table td {
    text-align: center;
  }
  .pdf-title-table tbody td {
    color: #1a1a18;
  }
  .pdf-carton-table tbody tr:last-child td {
    border-bottom: none;
  }
  .pdf-carton-table tfoot td {
    padding: 6px 8px;
    font-size: 9px;
    font-weight: 600;
    color: #1a1a18;
    background-color: #eef0f3;
    border-top: 1px solid #e5e7eb;
    border-bottom: none;
    vertical-align: middle;
  }
  .pdf-num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .pdf-center {
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: #6b7280;
  }
  .pdf-carton-table tbody td.pdf-center {
    color: #1a1a18;
  }
  .pdf-notes {
    margin-top: 16px;
    padding: 8px 10px;
    border: 1px solid #e5e7eb;
    border-radius: 3px;
    font-size: 9px;
  }
  .pdf-notes-title {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #374151;
    margin-bottom: 4px;
  }
  .pdf-empty {
    font-size: 9px;
    color: #6b7280;
    font-style: italic;
    margin: 0;
  }
</style>
</head>
<body>

<?!= poSectionsHtml ?>

</body>
</html>
